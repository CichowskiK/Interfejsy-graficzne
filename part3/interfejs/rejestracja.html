<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rejestracja – TicketHero</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="login-page">
    <header>
        <h1>Zarejestruj się</h1>
    </header>

    <nav>
        <ul>
            <li><a href="index.html">Szukaj koncertów</a></li>
            <li><a>Koncerty w twojej okolicy</a></li>
            <li><a href="login.html">Zaloguj się</a></li>
        </ul>
    </nav>

    <main>
        <div class="login-container">
            <form id="register-form">

                <div class="form_row">
                    <label for="first_name">Imię</label>
                    <input type="text" id="first_name" name="first_name" placeholder="Jan" required
                        oninvalid="this.setCustomValidity('Proszę podać imię')" oninput="this.setCustomValidity('')">
                </div>

                <div class="form_row">
                    <label for="last_name">Nazwisko</label>
                    <input type="text" id="last_name" name="last_name" placeholder="Kowalski" required
                        oninvalid="this.setCustomValidity('Proszę podać nazwisko')"
                        oninput="this.setCustomValidity('')">
                </div>

                <div class="form_row">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" placeholder="jan@example.com" required
                        oninvalid="this.setCustomValidity('Proszę podać poprawny adres e-mail (np. jan@example.com)')"
                        oninput="this.setCustomValidity('')">
                </div>

                <div class="form_row">
                    <label for="phone">Numer telefonu</label>
                    <input type="tel" id="phone" name="phone" placeholder="123456789" pattern="[0-9]{9}"
                        title="Numer musi składać się z 9 cyfr" required
                        oninvalid="this.setCustomValidity('Proszę podać poprawny numer telefonu (9 cyfr, bez spacji)')"
                        oninput="this.setCustomValidity('')">
                </div>

                <div class="form_row">
                    <label for="password">Hasło</label>
                    <input type="password" id="password" name="password" placeholder="********" required minlength="6"
                        oninvalid="this.setCustomValidity('Hasło musi mieć co najmniej 6 znaków')"
                        oninput="this.setCustomValidity('')">
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">
                    Utwórz konto
                </button>

                <p style="text-align: center; margin-top: 15px;">
                    Masz już konto? <a href="login.html">Zaloguj się</a>
                </p>

                <div id="register-error" class="info info-error" style="display: none; margin-top: 10px;"></div>
            </form>
        </div>
    </main>

    <script src="auth.js"></script>
    <script>
        const registerForm = document.getElementById('register-form');
        const errorDiv = document.getElementById('register-error');

        registerForm.addEventListener('submit', function (e) {
            e.preventDefault();

            const firstName = document.getElementById('first_name').value;
            const lastName = document.getElementById('last_name').value;
            const email = document.getElementById('email').value;
            const phone = document.getElementById('phone').value;
            const password = document.getElementById('password').value;

            const result = registerUser(firstName, lastName, email, phone, password);

            if (result.success) {
                // TUTAJ ZMIANA: Przekierowanie z parametrem ?registered=true
                window.location.href = 'login.html?registered=true';
            } else {
                errorDiv.textContent = result.message;
                errorDiv.style.display = 'block';
            }
        });
    </script>
</body>

</html>
