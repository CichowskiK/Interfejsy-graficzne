<!DOCTYPE html>
<html lang="pl">

<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Konto – TicketHero</title>
</head>

<body class="account-page">
    <header>
        <h1>Twój Profil</h1>
    </header>

    <nav>
        <ul>
            <li><a href="index.html">Szukaj koncertów</a></li>
            <li><a href="okolica.html">Koncerty w twojej okolicy</a></li>
            <li><a id="authBtn" href="login.html">Zaloguj się</a></li>
        </ul>
    </nav>

    <main>
        <section id="dane" class="profile-card">
            <img class="profile-avatar" alt="Zdjęcie użytkownika"
                src="https://tse3.mm.bing.net/th/id/OIP.UCM-fPGYrjFD5mteVKLJ4wHaJ8?cb=ucfimg2ucfimg=1&rs=1&pid=ImgDetMain&o=7&rm=3">

            <div class="profile-info">
                <h2>Ładowanie...</h2>
                <p>Pobieranie danych...</p>
            </div>
        </section>

        <section id="opcje">
            <div class="dashboard-grid">
                <a href="powiadomienia.html" class="dashboard-card">
                    <span class="dashboard-icon">&#128276;</span> Ustawienia powiadomień
                </a>

                <a href="historia.html" class="dashboard-card">
                    <span class="dashboard-icon">&#127903;</span> Historia Koncertów
                </a>

                <a href="ulubieni.html" class="dashboard-card">
                    <span class="dashboard-icon">&#10084;</span> Ulubieni Artyści
                </a>

                <a href="kalendarz.html" class="dashboard-card">
                    <span class="dashboard-icon">&#128197;</span> Kalendarz Wydarzeń
                </a>

                <a href="zmien_haslo.html" class="dashboard-card">
                    <span class="dashboard-icon">&#9881;</span> Zmiana hasła
                </a>
            </div>
        </section>
    </main>

    <script src="auth.js"></script>
    <script>
        requireAuth();
        const user = getCurrentUser();

        if (user) {
            document.querySelector('header h1').textContent = `Jesteś zalogowany jako: ${user.firstName}`;
            const infoDiv = document.querySelector('.profile-info');
            infoDiv.innerHTML = `
                <h2>${user.firstName} ${user.lastName}</h2>
                <p><strong>E-mail:</strong> ${user.email}</p>
                <p><strong>Telefon:</strong> ${user.phone || '-'}</p>
                <p><strong>Status konta:</strong> Aktywne</p>
            `;
        }
    </script>
</body>

</html>
